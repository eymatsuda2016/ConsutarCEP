name: Compilar e testar Consultar CEP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Release e testes
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar versão Release
        shell: pwsh
        run: msbuild .\ConsultaCEPs.csproj /t:Build /p:Configuration=Release /v:minimal

      - name: Executar testes automatizados
        shell: pwsh
        run: dotnet test .\Tests\ConsultaCEPs.Tests.csproj --verbosity minimal

      - name: Publicar artefato Release
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaCEPs-Release
          path: |
            bin/Release/ConsultaCEPs.exe
            bin/Release/ConsultaCEPs.exe.config
          if-no-files-found: error
