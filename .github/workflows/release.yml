name: Publicar Release do Consultar CEP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da Release, por exemplo v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar, testar e publicar artefatos
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar versão Release
        shell: pwsh
        run: msbuild .\ConsultaCEPs.csproj /t:Build /p:Configuration=Release /v:minimal

      - name: Executar testes automatizados
        shell: pwsh
        run: dotnet test .\Tests\ConsultaCEPs.Tests.csproj --verbosity minimal

      - name: Criar instalador
        shell: pwsh
        run: .\Installer\Criar-Instalador.ps1

      - name: Gerar checksums
        shell: pwsh
        run: |
          $arquivos = @(
            'bin/Release/ConsultaCEPs.exe',
            'bin/Release/ConsultaCEPs.exe.config',
            'bin/Release/ConsultarCEP-Setup.exe'
          )
          $linhas = foreach ($arquivo in $arquivos) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $arquivo).Hash
            "$hash  $([System.IO.Path]::GetFileName($arquivo))"
          }
          Set-Content -LiteralPath 'bin/Release/SHA256SUMS.txt' -Value $linhas -Encoding ASCII

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Consultar CEP ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            bin/Release/ConsultaCEPs.exe
            bin/Release/ConsultaCEPs.exe.config
            bin/Release/ConsultarCEP-Setup.exe
            bin/Release/SHA256SUMS.txt
